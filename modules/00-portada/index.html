<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CajaControl</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
        }

        .background {
            position: fixed;
            width: 500px;
            height: 500px;
            background: linear-gradient(
                135deg,
                #dce7ff,
                #f0e5ff,
                #e1f5f0
            );
            filter: blur(90px);
            border-radius: 50%;
            animation: floating 10s ease-in-out infinite alternate;
        }

        .welcome {
            position: relative;
            z-index: 1;
            width: min(90%, 440px);
            padding: 55px 35px;
            text-align: center;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.07);
            backdrop-filter: blur(25px);
            animation: appear 1s ease both;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 25px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            background: #1d1d1f;
            color: white;
            font-size: 35px;
            font-weight: 600;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: clamp(30px, 6vw, 38px);
            letter-spacing: -1.5px;
            font-weight: 650;
        }

        p {
            margin-top: 12px;
            color: #77777d;
            font-size: 15px;
            line-height: 1.6;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            padding: 10px 15px;
            border-radius: 30px;
            background: #f0f0f2;
            color: #55555b;
            font-size: 12px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34c759;
            box-shadow: 0 0 12px #34c75980;
        }

        footer {
            position: fixed;
            bottom: 22px;
            color: #99999f;
            font-size: 12px;
        }

        @keyframes floating {
            from {
                transform: translate(-80px, -50px) scale(0.9);
            }
            to {
                transform: translate(80px, 50px) scale(1.15);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <main class="welcome">
        <div class="logo">C</div>

        <h1>CajaControl</h1>

        <p>
            Controla tu negocio.<br>
            Administra cada movimiento.
        </p>

        <div class="status">
            <span class="dot"></span>
            Proyecto en desarrollo
        </div>
    </main>

    <footer>
        CajaControl · Administración comercial
    </footer>

</body>
</html>
