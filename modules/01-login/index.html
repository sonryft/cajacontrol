<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08090c">

    <title>Iniciar sesión | CajaControl</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="login-container">

        <header class="logo">
            <h2 class="marca">CajaControl</h2>
            <p>Administración comercial</p>
        </header>

        <section class="login-card">
            <h1>Bienvenido</h1>

            <p class="descripcion">
                Ingresa a tu cuenta para continuar.
            </p>

            <form id="login-form">

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nombre@empresa.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Introduce tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-password"
                            id="toggle-password"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button" id="login-button">
                    Iniciar sesión
                </button>

                <div
                    class="mensaje"
                    id="login-message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>
        </section>

        <footer class="pie">
            CajaControl · Gestión inteligente de tu negocio
        </footer>

    </main>

    <!-- Biblioteca oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración y lógica de acceso -->
    <script src="supabase.js"></script>
    <script src="login.js"></script>
</body>
</html>
