<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08090c">

    <title>Iniciar sesión | CajaControl</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

     <header class="logo">
    <h2 class="marca">CajaControl</h2>
    <p>Administración comercial</p>
</header>

        <section class="login-card">

            <h1>Bienvenido</h1>

            <p class="descripcion">
                Ingresa a tu cuenta para continuar.
            </p>

            <form id="login-form">

                <div class="campo">
                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="nombre@empresa.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Introduce tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-password"
                            id="mostrar-password"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>

                <div
                    class="mensaje"
                    id="mensaje"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>

        </section>

        <footer class="pie">
            CajaControl · Gestión inteligente de tu negocio
        </footer>

    </main>

    <script src="login.js"></script>

</body>
</html>
